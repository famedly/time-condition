name: Rust workflow

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: famedly/backend-build-workflows/.github/workflows/rust-workflow.yml@tlater/breaking-changes
    secrets: inherit
    with:
      ref: tlater/breaking-changes
      run-doctests: false
